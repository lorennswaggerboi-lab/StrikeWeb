# Blueprint de Render: despliega el servidor multijugador (cuentas, lobby y partidas).
# En Render: New + > Blueprint > selecciona este repositorio.
services:
  - type: web
    name: strike-web
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        value: elalfredonico@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BOTS_PER_TEAM
        value: "5"
      - key: BOT_SKILL
        value: "0.5"
      # Para que las cuentas no se borren al reiniciar, pega aquí la URL de una base
      # de datos PostgreSQL (por ejemplo, gratis en neon.tech o en Render Postgres).
      - key: DATABASE_URL
        sync: false
